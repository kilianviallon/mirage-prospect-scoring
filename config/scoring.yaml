# =============================================================================
# Configuration du scoring Mirage Metrics
# Toutes les règles sont ici : on peut modifier poids, seuils et barèmes
# sans toucher au code. Relancer le calcul après chaque modification.
# =============================================================================

# --- Gestion de l'incertitude -------------------------------------------------
uncertainty:
  neutral_score: 2.5        # note attribuée quand une donnée est inconnue (sur 5)
  hypothesis_shift: 1       # une hypothèse se rapproche de 1 point de la note neutre
                            # (sans la dépasser). ex. 5 → 4, 4 → 3, 3 → 2.5, 1 → 2, 0 → 1

# --- Étiquettes de priorité ---------------------------------------------------
priority:
  high_score: 70            # score minimal pour être « Prioritaire »
  medium_score: 50          # score minimal pour être « Secondaire »
  min_confidence: 0.5       # en dessous : un bon score devient « À approfondir »

# --- Critères de disqualification ---------------------------------------------
# Appliqués avant le scoring. Si la donnée est un fait : entreprise écartée.
# Si c'est une hypothèse : entreprise signalée « à vérifier », pas écartée.
disqualifiers:
  - id: insolvency
    field: legal_status
    disqualify_if_in: [procedure_collective, liquidation]
    reason: "Procédure collective ou liquidation : pas de budget, avenir incertain"
  - id: decision_outside_zone
    field: decision_center_outside_zone
    disqualify_if: true
    reason: "Rachetée par un groupe qui décide hors de la zone ciblée"
  - id: too_large
    field: employees
    disqualify_if_above: 5000
    reason: "Plus de 5 000 salariés : relève d'une approche grands comptes, pas de cette prospection"
  - id: competitor_in_place
    field: competitor_covers_core_workflow
    disqualify_if: true
    reason: "Un outil concurrent couvre déjà le workflow principal"

# --- Critères de qualification (total des poids = 100) ------------------------
criteria:

  intermediary_role:
    label: "Rôle d'intermédiaire"
    weight: 25
    question: "Consulte-t-elle un réseau de prestataires pour répondre à ses clients ?"
    field: business_model
    type: categorical
    scores:
      commissionnaire: 5          # vend un transport acheté à un réseau (profil OFRET)
      transitaire: 4
      entreprise_generale: 4      # BTP : remporte le chantier, sous-traite les lots
      sous_traitant_industriel: 3 # coordonne ses propres partenaires (traitements…)
      distributeur_b2b: 3         # achète aux fabricants, revend aux professionnels
      agence_evenementielle: 3    # assemble les offres de nombreux fournisseurs
      transporteur_flotte_propre: 1
      autre: 0

  request_volume:
    label: "Volume de demandes"
    weight: 10
    question: "Combien de cotations, offres ou commandes traite-t-elle ?"
    field: volume_level
    type: categorical
    scores:
      eleve: 5    # ex. > 100 offres/an, > 1 000 commandes/an, promesse de devis rapide
      moyen: 3    # ex. 30 à 100 offres/an
      faible: 1   # ex. < 30 offres/an

  unstructured_inputs:
    label: "Demandes non structurées"
    weight: 15
    question: "Les demandes arrivent-elles en texte libre, PDF ou plans ?"
    fields: [free_text_requests, email_or_pdf_orders, drawings_to_read]
    type: count_true
    scores:          # nombre de cases cochées → note
      2: 5           # 2 ou plus
      1: 3
      0: 1

  mirage_case_proximity:
    label: "Proximité avec un cas Mirage"
    weight: 15
    question: "Mirage a-t-il déjà prouvé sa valeur sur ce métier ?"
    field: case_match
    type: categorical
    scores:
      same_business: 5    # même métier (commissionnaire ↔ OFRET, distributeur ↔ Biodéal)
      same_mechanism: 3   # même mécanique, secteur voisin (BTP ↔ OCBM)
      analogy: 1          # simple analogie (événementiel ↔ cotation OFRET)
      none: 0

  integrable_software:
    label: "Logiciel intégrable"
    weight: 10
    question: "Connaît-on le logiciel cœur (TMS, ERP, chiffrage) et peut-on s'y brancher ?"
    field: software_status
    type: categorical
    scores:
      known_with_api: 5
      known: 3
      # non renseigné → note neutre (2.5)

  size:
    label: "Taille et budget"
    weight: 10
    question: "L'entreprise a-t-elle la taille idéale pour acheter vite ?"
    field: employees
    type: bands
    bands:           # [min, max] inclus → note
      - [20, 500, 5]       # budget suffisant, décision rapide
      - [1, 19, 3]         # implémentation simple, mais budget et volume limités
      - [501, 2000, 3]     # budget confortable, décision plus lente
      - [2001, 5000, 1]    # plusieurs décideurs, cycle de vente long

  timing:
    label: "Signal de timing"
    weight: 15
    question: "A-t-elle une raison d'agir maintenant ?"
    field: signals
    type: signals
    scores:
      two_or_more_facts: 5   # au moins 2 signaux vérifiés
      one_fact: 4            # 1 signal vérifié
      hypotheses_only: 4     # signaux seulement supposés (ramenés ensuite à 3 par la règle d'incertitude)
      negative: 0            # signal négatif vérifié : l'emporte sur tous les signaux positifs
      # aucun signal trouvé → note neutre (2.5) : l'absence de preuve
      # n'est pas une preuve d'absence
